name: Build Firmware & Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Versions match tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) V="${TAG#v}" ;;
            *) echo "not a version tag ($TAG) — skipping"; exit 0 ;;
          esac
          MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          WANT_NUM=$(printf '0x%02d%02d%02d' "$MAJOR" "$MINOR" "$PATCH")

          FW=$(sed -n 's/.*#define FW_VERSION  *"\([0-9.]*\)".*/\1/p' src/protocol.h)
          FWNUM=$(sed -n 's/.*#define FW_VERSION_NUM  *\(0x[0-9a-fA-F]*\).*/\1/p' src/protocol.h)
          PUB=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' companion/pubspec.yaml)
          APP=$(sed -n "s/.*kAppVersion = '\([0-9.]*\)'.*/\1/p" companion/lib/core/app_version.dart)

          rc=0
          check() { [ "$2" = "$3" ] || { echo "::error::$1 is '$2', tag wants '$3'"; rc=1; }; }
          check "src/protocol.h FW_VERSION"          "$FW"    "$V"
          check "src/protocol.h FW_VERSION_NUM"      "$FWNUM" "$WANT_NUM"
          check "companion/pubspec.yaml"             "$PUB"   "$V"
          check "app_version.dart kAppVersion"       "$APP"   "$V"
          [ $rc -eq 0 ] && echo "all version sources = $V"
          exit $rc

  build-firmware:
    name: Firmware (${{ matrix.role }}-${{ matrix.board }})
    needs: [version-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only boards that have actually been run. platformio.ini carries many
        # more targets; an untested build in a release is a claim nobody has
        # checked. Add a row here once a board has been flashed and used.
        include:
          - env: v3_app_controlled
            role: node
            board: xiao_s3
            chip: esp32s3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install 'platformio==6.2.0'

      - name: Build firmware (${{ matrix.env }})
        run: pio run -e ${{ matrix.env }}

      - name: Package firmware
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          ROLE="${{ matrix.role }}"
          BOARD="${{ matrix.board }}"
          ENV="${{ matrix.env }}"
          STEM="oui-snitch-${ROLE}-${BOARD}-${VERSION}"
          mkdir -p dist
          cp ".pio/build/${ENV}/firmware.bin"   "dist/${STEM}.bin"
          cp ".pio/build/${ENV}/bootloader.bin" "dist/${STEM}-bootloader.bin"
          cp ".pio/build/${ENV}/partitions.bin" "dist/${STEM}-partitions.bin"
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" -path "*/partitions/*" | head -1)
          cp "$BOOT_APP0" "dist/${STEM}-boot_app0.bin"
          # MIT and Apache-2.0 both require the notices to travel with the binaries.
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && tar czf "../${STEM}-usb.tar.gz" \
            "${STEM}-bootloader.bin" "${STEM}-partitions.bin" "${STEM}.bin" "${STEM}-boot_app0.bin" \
            LICENSE THIRD_PARTY_NOTICES.md)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-${{ matrix.role }}-${{ matrix.board }}
          path: |
            dist/oui-snitch-*.bin
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
            oui-snitch-*-usb.tar.gz

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-firmware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## OUI-SNITCH ${{ github.ref_name }}

            > [!NOTE]
            > Beta software. Read **Known limits** in the README before relying
            > on this for anything that matters. Bugs go in Issues.

            ### Firmware

            | Target | Role | OTA asset | First flash (USB) |
            |--------|------|-----------|-------------------|
            | XIAO ESP32-S3 | node | `oui-snitch-node-xiao_s3-${{ github.ref_name }}.bin` | `oui-snitch-node-xiao_s3-${{ github.ref_name }}-usb.tar.gz` |

            The XIAO ESP32-S3 is the only board this release is built for. Other
            targets exist in `platformio.ini` and are untested.

            First flash on a bare board: extract `*-usb.tar.gz` and write it with
            esptool. **Use DIO mode** — writing the image as QIO produces a board
            that boot loops with `TG0WDT_SYS_RST` and looks bricked.

            ### Companion app

            The Android APK is attached by hand; this workflow builds firmware only.

            ### Requirements

            - Seeed XIAO ESP32-S3, and a USB-C **data** cable
            - An Android phone — the app is the only user interface
            - Location permission for wardriving

            ### Not compatible with OUI-APEX

            The firmware-to-app protocol has diverged. Run OUI-SNITCH firmware
            with the OUI-SNITCH app only — mixing them is silent, not noisy. See
            [COMPATIBILITY.md](https://github.com/F0x-tail/oui-snitch/blob/main/COMPATIBILITY.md).
          files: |
            artifacts/**/*.bin
            artifacts/**/*.tar.gz
            artifacts/**/LICENSE
            artifacts/**/THIRD_PARTY_NOTICES.md
